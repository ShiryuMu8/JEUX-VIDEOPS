name: Space Word CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:

  ci-space-word: # intégration continue
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd games/space-word && npm install

      - name: Lint
        run: cd games/space-word && npx eslint src/

      - name: Unit tests
        run: cd games/space-word && npm test

      - name: Security audit
        run: cd games/space-word && npm audit --audit-level=critical

  cd-space-word: # déploiement continu
    runs-on: ubuntu-latest
    needs: ci-space-word # attend que le CI passe avant de déployer

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./games/space-word