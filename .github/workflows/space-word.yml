name: Space Word CI/CD

# on: ce qui vient déclencher le workflow
on:
  push:
    branches: [ "**" ] # déclenchement sur toutes les branches
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch: # lancement manuel

jobs:
  ci-space-word: # job d'intégration continue
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # installation de Cypress (racine) et du serveur de jeu (local)
        run: |
          npm install
          cd games/space-word && npm install

      - name: Linter (Google Style)
        # vérification du respect des règles de codage
        run: cd games/space-word && npx eslint script.js

      - name: Unit tests
        # exécution des tests unitaires avec Jest + annotations GitHub
        run: cd games/space-word && npm test -- --reporters=default --reporters=github-actions

      - name: Cypress Functional Tests
        # cypress fait un retour avec annotations
        uses: cypress-io/github-action@v6
        with:
          start: npm start --prefix games/space-word
          wait-on: 'http://localhost:3000'
          spec: cypress/e2e/space-word.cy.js

      - name: Security Audit
        # audit des vulnérabilités critiques
        run: cd games/space-word && npm audit --audit-level=critical

      - name: Final Summary Report
        # résumé du workflow via commandes de flux de travail
        if: always()
        run: |
          echo "### Résumé du Workflow" >> $GITHUB_STEP_SUMMARY
          echo "Le pipeline Space Word a été exécuté avec succès." >> $GITHUB_STEP_SUMMARY
          echo "Annotations générées automatiquement pour Cypress et Lint." >> $GITHUB_STEP_SUMMARY

  cd-space-word: # job de déploiement continu
    runs-on: ubuntu-latest
    needs: ci-space-word # le déploiement ne se fait que si les tests passent

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./games/space-word
          destination_dir: space-word # déploie dans un sous-dossier
          keep_files: true # garde les autres fichiers déjà déployés

  deploy-index: # déploie la page d'accueil
    runs-on: ubuntu-latest
    needs: cd-space-word

    steps:
      - uses: actions/checkout@v4

      - name: Deploy index
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: true