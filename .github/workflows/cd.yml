name: CD Deployment

on:
  push:
    branches: [ main, dev, "feat/spacetests" ]

jobs:
  deploy_job: 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./games