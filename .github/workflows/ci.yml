name: CI Jeux Videops

# on: ce qui vient déclencher le workflow
on:
  push: # déclenchement au push
  pull_request: # déclenchement sur les PR
  workflow_dispatch: # lancement manuel

# les jobs à exécuter
jobs:

  test-two-ships: # job pour two-ships
    runs-on: ubuntu-latest # machine virtuelle Linux

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # récupère le code

      - name: Setup Node.js
        uses: actions/setup-node@v4 # installe Node.js
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd games/two-ships && npm install # installe les dépendances

      - name: Unit tests
        run: cd games/two-ships && npm test # lance les tests unitaires

      - name: Security audit
        run: cd games/two-ships && npm audit --audit-level=high # audit sécurité

  test-space-invaders: # job pour space-invaders
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd games/space-invaders && npm install

      - name: Unit tests
        run: cd games/space-invaders && npm test

      - name: Security audit
        run: cd games/space-invaders && npm audit --audit-level=high